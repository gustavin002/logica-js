<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main">
        <h1>Conversão de temperaturas</h1>
        <label for="celsius">Temperatura em Celsius</label>
        <input type="number" id="celsius" step="0.1">
        <button id="calcular1">Calcular</button>
        <p id="resultado1" class="resultado">O resultado aparece aqui.</p>

        <label for="fahrenheit">Temperatura em Fahrenheit</label>
        <input type="number" id="fahrenheit" step="0.1">
        <button id="calcular2">Calcular</button>
        <p id="resultado2" class="resultado">O resultado aparece aqui.</p>
    </main>
    <script src="./../aula10/js/comum.js"></script>
    <script src="js/temperatura.js"></script>
</body>
</html>
