<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconto | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="exercicio">
        <h1>Calculadora de desconto</h1>
        <label for="preco">Preço</label>
        <input type="number" id="preco" step="0.01">
        <label for="porcentagem">Porcentagem de desconto</label>
        <input type="number" id="porcentagem" step="0.1">
        <button id="calcular">Calcular</button>
        <p id="resultado" class="resultado">O resultado aparece aqui.</p>
    </main>
    <script src="js/desconto.js"></script>
</body>
</html>
