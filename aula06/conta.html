<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachando a conta | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="exercicio">
        <h1>Rachando a conta</h1>
        <label for="conta">Valor da conta</label>
        <input type="number" id="conta" step="0.01">
        <label for="pessoas">Número de pessoas</label>
        <input type="number" id="pessoas" step="1">
        <button id="calcular">Calcular</button>
        <p id="resultado" class="resultado">O resultado aparece aqui.</p>
    </main>
    <script src="js/conta.js"></script>
</body>
</html>
