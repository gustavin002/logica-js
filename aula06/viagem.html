<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custo da viagem | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="exercicio">
        <h1>Custo da viagem</h1>
        <label for="distancia">Distância em km</label>
        <input type="number" id="distancia" step="0.1">
        <label for="consumo">Consumo em km por litro</label>
        <input type="number" id="consumo" step="0.1">
        <label for="preco_litro">Preço do litro</label>
        <input type="number" id="preco_litro" step="0.01">
        <button id="calcular">Calcular</button>
        <p id="resultado" class="resultado">O resultado aparece aqui.</p>
    </main>
    <script src="js/viagem.js"></script>
</body>
</html>
