<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivinhação com limite | Lógica com JS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
  <main class="exercicio">
    <h1>Adivinhe em até 7 tentativas</h1>
    <p>Digite um número de 1 a 100</p>

    <label for="chute">Seu chute (1 a 100)</label>
    <input type="number" id="chute" min="1" max="100">

    <button id="chutar">Chutar</button>
    <p id="resultado" class="resultado">O resultado aparece aqui.</p>
  </main>

  <script src="js/adivinhacao.js"></script>
</body>
</html>
